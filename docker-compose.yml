version: "3.8"

services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: akaunting
      MYSQL_USER: akaunting
      MYSQL_PASSWORD: messi_a
      MYSQL_ROOT_PASSWORD: messi_a_root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-time setup: runs php artisan install, then exits
  setup:
    image: akaunting/akaunting:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_URL: http://localhost:5000
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: messi
      DB_USERNAME: messi
      DB_PASSWORD: messi_a
      ADMIN_EMAIL: admin@company.com
      ADMIN_PASSWORD: 123456
    volumes:
      - app-data:/var/www/html
    command: >
      sh -lc '
        set -e;
        cd /var/www/html;
        [ -f .env ] || cp .env.example .env;
        php artisan key:generate --force;
        php artisan install
          --db-name="$DB_DATABASE"
          --db-username="$DB_USERNAME"
          --db-password="$DB_PASSWORD"
          --db-host="$DB_HOST"
          --admin-email="$ADMIN_EMAIL"
          --admin-password="$ADMIN_PASSWORD";
      '
    restart: "no"

  akaunting:
    image: akaunting/akaunting:latest
    depends_on:
      db:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    ports:
      - "5857:80"
    environment:
      APP_URL: http://localhost:5000
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: messi
      DB_USERNAME: messi
      DB_PASSWORD: messi_a
    volumes:
      - app-data:/var/www/html
    restart: unless-stopped

volumes:
  db-data:
  app-data:
